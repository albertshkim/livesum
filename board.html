<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>집계 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-box">
    <div class="brand" style="margin-bottom:20px;">ANON · BOARD</div>
    <p class="auth-title">비밀번호를 입력하세요</p>
    <form id="authForm">
      <input type="password" id="authPasswordInput" class="auth-input" placeholder="비밀번호" autocomplete="off" />
      <button type="submit" class="submit-btn" style="width:100%;margin-top:14px;">입장</button>
    </form>
    <div class="status-msg error" id="authError" style="text-align:center;margin-top:14px;"></div>
  </div>
</div>
<script src="auth.js"></script>
<div class="topbar">
  <div class="brand">ANON · BOARD</div>
  <a class="nav-link" href="index.html">← 답변하러 가기</a>
</div>

<div class="wrap-wide">

  <div id="setupBanner"></div>

  <div class="board-header">
    <div>
      <div class="eyebrow"><span class="dot-live"></span><span id="questionLabel">실시간 집계 중</span></div>
      <h1 class="board-question" id="questionText">질문을 불러오는 중…</h1>
    </div>
    <div class="counter">
      <span class="num" id="answerCount">0</span>
      <span class="label">답변</span>
      <div style="margin-top:12px;">
        <button class="copy-btn" id="copyAllBtn">답변 전체 복사</button>
      </div>
      <div class="status-msg" id="copyStatus" style="text-align:right;"></div>
    </div>
  </div>

  <div class="view-toggle" role="tablist">
    <button class="toggle-btn active" id="viewCloudBtn" role="tab">워드클라우드</button>
    <button class="toggle-btn" id="viewCardBtn" role="tab">카드형</button>
  </div>

  <div class="wordcloud-wrap" id="wordcloudWrap">
    <canvas id="wordcloudCanvas"></canvas>
    <div class="empty-state" id="cloudEmptyState">아직 도착한 답변이 없습니다.</div>
  </div>

  <div class="board-grid" id="boardGrid" style="display:none;">
    <div class="empty-state">아직 도착한 답변이 없습니다.</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="board.js"></script>

</body>
</html>
