name: Deploy to GitHub Pages

# main 브랜치에 푸시될 때마다 자동으로 배포됩니다.
# Settings → Pages → Source 를 "GitHub Actions"로 설정해야 동작합니다.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # 저장소 Settings → Secrets and variables → Actions 에 등록해둔
      # 값들로 firebase-config.js 를 배포 시점에 생성합니다.
      # (이 파일은 git에는 없지만, 배포되는 사이트에는 포함됩니다.)
      - name: firebase-config.js 생성
        run: |
          cat > firebase-config.js << EOF
          const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            databaseURL: "${{ secrets.FIREBASE_DATABASE_URL }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}"
          };
          EOF

      # 마찬가지로 auth-config.js 도 Secrets 값으로 생성합니다.
      - name: auth-config.js 생성
        run: |
          cat > auth-config.js << EOF
          const SITE_PASSWORD = "${{ secrets.SITE_PASSWORD }}";
          const ADMIN_PASSWORD = "${{ secrets.ADMIN_PASSWORD }}";
          EOF

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
